<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Operator - Antrian RS</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="dist/operator.js" defer></script>
</head>
<body>

  <nav class="navbar">
    <div style="display: flex; align-items: center; gap: 2.5rem;">
      <a href="operator.html" class="brand-wrapper">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 6v12M6 12h12"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">Antrian RS</span>
          <span class="brand-subtitle">Pelayanan rumah sakit</span>
        </div>
      </a>

      <ul class="nav-links">
        <li><a href="operator.html" class="nav-link active">Panel Operator</a></li>
        <li id="nav-admin-item" style="display: none;"><a href="index.html" class="nav-link">Dashboard Admin</a></li>
        <li><a href="layar.html" class="nav-link" target="_blank">Layar Antrian</a></li>
        <li><a href="ambil-antrian.html" class="nav-link" target="_blank">Ambil Antrian</a></li>
      </ul>
    </div>

    <div class="nav-actions">
      <div class="user-pill">
        <span id="user-display-name">Petugas</span>
      </div>
      <button type="button" id="logout-btn" class="btn btn-sm btn-outline">Keluar</button>
    </div>
  </nav>

  <main class="container-wide">
    <div class="page-header">
      <div>
        <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.25rem;">
          <h1 class="page-title">Panel Operator</h1>
          <span id="total-waiting-badge" class="badge" style="background-color: var(--color-brand-light); color: var(--color-brand); border: 1px solid var(--color-brand-border); font-size: 0.8rem; padding: 0.25rem 0.75rem;">
            0 tiket menunggu
          </span>
        </div>
        <p class="page-subtitle">Panggil dan kelola tiket untuk setiap layanan aktif.</p>
      </div>
    </div>

    <div id="operator-cards-container" class="grid-3" style="margin-bottom: 2rem;"></div>
  </main>

  <footer class="app-footer">
    <div class="container-wide app-footer-inner">
      <span>Antrian RS &middot; Pelayanan rumah sakit</span>
      <span>Kelola layanan dengan tertib, layani dengan nyaman.</span>
    </div>
  </footer>

</body>
</html>
