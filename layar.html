<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layar Antrian - Antrian RS</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="dist/display.js" defer></script>
</head>
<body class="layar-page">

  <header class="display-header">
    <div class="display-header-inner">
      <div class="brand-wrapper">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 6v12M6 12h12"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title" style="font-size: 1.35rem;">Antrian RS</span>
          <span class="brand-subtitle">Pelayanan rumah sakit</span>
        </div>
      </div>

      <div class="display-header-controls">
        <div id="digital-clock" class="display-clock">
          10:15 WIB
        </div>

        <div class="display-actions">
          <button type="button" id="sound-toggle-btn" class="btn btn-sm btn-outline" title="Nyalakan/matikan suara panggilan">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            </svg>
            Suara Aktif
          </button>

          <button type="button" id="fullscreen-btn" class="btn btn-sm btn-outline">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 0.25rem;">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </svg>
            Layar Penuh
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="container-wide" style="padding-top: 1.75rem; padding-bottom: 4rem;">
    <div class="display-title-row">
      <div>
        <h1 class="page-title" style="font-size: 2rem; margin-bottom: 0.35rem;">
          Nomor sedang dipanggil
        </h1>
        <p class="page-subtitle" style="font-size: 1rem;">
          Silakan menuju layanan sesuai nomor antrian Anda.
        </p>
      </div>
    </div>

    <!-- Cards Grid (Exact Figma Layout with Dynamic Call-Positioning) -->
    <div id="display-cards-container" class="display-cards-grid"></div>
  </main>

  <!-- Footer Banner Matching Figma Layar.png -->
  <footer class="display-footer-banner">
    <div class="container-wide display-footer-banner-inner">
      <span>Siapkan nomor antrian Anda dan tunggu hingga dipanggil.</span>
      <span>Butuh bantuan? Hubungi petugas.</span>
    </div>
  </footer>

</body>
</html>
